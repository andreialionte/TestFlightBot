services:
  testflightbot:
    image: testflightbot
    build:
      context: .
      dockerfile: TestFlightBot/Dockerfile
    environment:
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_CHAT_ID: ${TG_CHAT_ID}
      TF_POLL_MINUTES: ${TF_POLL_MINUTES:-2}
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
